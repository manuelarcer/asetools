# modular_stage_composition.yaml
#
# Demonstrates the modular stage-composition path: reusable `stage_templates`
# instantiated and ordered from the Python submission script (see
# submit_modular_example.py in this directory), instead of writing one fully
# specified named workflow per objective.
#
# The existing `workflows:` section still works unchanged; this file just adds
# the `stage_templates:` section and a `globals.mlip_envs` registry. See
# docs/vasp_calculation_guide.md ("Modular stage composition") and the design
# spec docs/superpowers/specs/2026-06-23-modular-stage-composition-design.md.

##########################
# 1) BASIC VASP SETTINGS #
##########################
basic:
  algo:         Fast
  ediff:        !!float 1e-6
  ediffg:       -0.02
  encut:        500
  kspacing:     0.6
  ibrion:       2
  icharg:       1
  isif:         0
  ismear:       0
  ispin:        2
  istart:       0
  isym:         0
  lasph:        true
  lcharg:       false
  lreal:        Auto
  lwave:        false
  nelm:         120
  nelmin:       4
  nsw:          500
  nupdown:      -1
  prec:         Normal
  sigma:        0.05
  xc:           PBE

################################
# 2) MATERIAL-SPECIFIC OVERRIDES #
################################
systems:
  CuNiOOH:
    setups:
      Ni: _pv
    magmom:
      Ni: 2.0
      Cu: 0.0
      O: 0.0
      H: 0.0
    ivdw: 11
    lmaxmix: 4
    lorbit: 11

###########################
# 3) WORKFLOW DEFINITIONS #
###########################
# Named workflows still work exactly as before (kept for the named-workflow
# path / backward compatibility). New work uses stage_templates below.
workflows:
  relax_last_step:
    stages:
      - name: OPT_ENCUT_500
        steps:
          - name: single_point
            overrides: { nsw: 0, nelm: 800, ispin: 1, lcharg: true, encut: 500 }
          - name: optimization
            overrides: { encut: 500 }

###############################
# 4) STAGE TEMPLATES (modular) #
###############################
# Each template is a reusable, parameterized stage body. The submission script
# instantiates them with cfg.stage(name=..., overrides=..., optimizer_kwargs=...)
# and orders them into a list passed to run_stages().
stage_templates:

  # VASP ENCUT-ramp pre-optimization with ASE BFGS + Hookean scaffolding.
  # Instantiate once per ENCUT/fmax: cfg.stage('encut_ramp', name='OPT_340',
  #   overrides={'encut': 340}, optimizer_kwargs={'fmax': 0.05})
  encut_ramp:
    constraints:
      type: hookean
      config_file: hookean_c_pairs.json
      spring_constant: 20.0
    steps:
      - name: single_point
        overrides: { nsw: 0, nelm: 800, ispin: 1, lcharg: true, ediff: 0.0001 }
      - name: optimization_bfgs
        overrides: { nsw: 500, lcharg: true, ediff: 0.0001 }
        optimizer: BFGS
        optimizer_kwargs: { maxstep: 0.2 }

  # Canonical final optimization. No constraints block -> runs released.
  # Instantiate with no overrides so YAML values stay authoritative:
  #   cfg.stage('production', name='OPT_500')
  production:
    steps:
      - name: single_point
        overrides: { nsw: 0, nelm: 800, ispin: 1, lcharg: true, encut: 500 }
      - name: optimization
        overrides: { encut: 500 }

  # MLIP pre-optimization (engine: mlip). Runs as a subprocess in the MLIP env
  # keyed by `env:` below. Pre-optimization only: must precede all VASP stages.
  uma_preopt:
    engine: mlip
    mlip: uma-s-1p2
    env: uma
    optimizer: bfgs
    fmax: 0.10
    max_steps: 300
    relax_cell: false
    device: auto
    constraints:
      type: hookean
      config_file: hookean_c_pairs.json
      spring_constant: 20.0

############################
# 5) OTHER PROJECT GLOBALS #
############################
globals:
  VASP_PP_PATH: "/home/users/astar/ihpc/juar/PP_VASP/AOR"
  initial_conf_pattern: "*.vasp"
  # Per-MLIP env registry: env key -> Python interpreter of that MLIP env.
  # Only this block changes when moving between machines.
  mlip_envs:
    uma:  "/home/users/astar/ihpc/juar/venv/uma/bin/python"
    mace: "/home/users/astar/ihpc/juar/venv/mace/bin/python"
